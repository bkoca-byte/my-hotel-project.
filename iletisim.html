<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="iletisim.css">
</head>
<body>
    <!-- Üst Menü -->
    <header class="ust-menu">
        <div class="container-fluid">
            <div class="menu-icerik">
                <a class="brand" href="index.html">
                    <img src="../resimler/resim3.jpg" alt="Logo" class="menu-logo">
                </a>
                
                <nav>
                    <ul class="menu-linkleri">
                        <li><a href="index.html">ANASAYFA</a></li>
                        <li><a href="hakkimda.html">HAKKIMDA</a></li>
                        <li><a href="odalarimiz.html">ODALARIMIZ</a></li>
                        <li><a href="galeri.html">GALERİ</a></li>
                        <li><a href="iletisim.html">İLETİŞİM</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <div class="sayfa-alani" style="margin-top: 90px;">
        <section class="iletisim-alani">
            <div class="form-kart">
                <div class="form-baslik">
                    <h2>Bana Mesaj Gönder</h2>
                    <p>Sorularınız veya iş birliği için aşağıdaki formu doldurabilirsiniz.</p>
                </div>
                <form action="#">
                    <div class="input-satir">
                        <div class="input-grubu">
                            <label for="ad-soyad">Ad Soyad</label>
                            <input type="text" id="ad-soyad" name="ad-soyad" placeholder="Adınız Soyadınız" required>
                        </div>
                        <div class="input-grubu">
                            <label for="telefon">Telefon</label>
                            <input type="tel" id="telefon" name="telefon" placeholder="05XX XXX XX XX" required>
                        </div>
                    </div>
                    <div class="input-grubu">
                        <label for="email">E-posta Adresi</label>
                        <input type="email" id="email" name="email" placeholder="mail@adresiniz.com" required>
                    </div>
                    <div class="input-grubu">
                        <label for="mesaj">Mesajınız</label>
                        <textarea id="mesaj" name="mesaj" rows="5" placeholder="Mesajınızı buraya yazın..." required></textarea>
                    </div>
                    <div class="buton-grubu">
                        <button type="submit" class="buton gonder">Gönder</button>
                        <button type="reset" class="buton temizle">Formu Temizle</button>
                    </div>
                </form>
            </div>
        </section>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
